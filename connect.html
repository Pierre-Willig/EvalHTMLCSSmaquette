<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Login</title>
</head>
<body>

    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <section>
            <form action="" method="post">
                <fieldset class="border border-2 border-info p-3 shadow">
                    <legend>Identifiez-vous :</legend>
                    <div class="row">
                        <div class="col col-6">
                            <div class="form-floating mt-3 mb-3">
                                <input type="text" name="user" id="user" class="form-control" placeholder="test" required>
                                <label for="user" class="form-label">Nom d'utilisateur</label>
                            </div>
                        </div>
                        <div class="col col-6">
                            <div class="form-floating mt-3 mb-3">
                                <input type="password" name="mdp" id="mdp" class="form-control" placeholder="" required>
                                <label for="mdp">Mot de passe</label>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <label for="send"><input class="btn btn-primary shadow" type="submit" name="submit" id="submit" value="Se connecter"></label>
                    </div>
                </fieldset>
            </form>
        </section>
    </main>
    
</body>
</html>
