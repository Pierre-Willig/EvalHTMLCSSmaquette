<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <main>
        <section>
            <form action="" method="post">
                <fieldset>
                    <legend>Inscription :</legend>
                    <table>
                        <tr>
                            <td><label for="user">* Choisissez un nom d'utilisateur :</label></td>
                            <td><input type="text" name="user" id="user" placeholder="username" required></td>
                        </tr>
                        <tr>
                            <td><label for="mdp">* Entrez un mot de passe :</label></td>
                            <td><input type="password" name="mdp" id="mdp" required></td>
                        </tr>
                        <tr>
                            <td><label for="email">* Entrez une adresse mail :</label></td>
                            <td><input type="email" name="email" id="email" required></td>
                        </tr>
                    </table>
                </fieldset>

                <fieldset>
                    <legend>Informations personnelles :</legend>
                    <table>
                        <tr>
                            <td><label for="name">* Prénom :</label></td>
                            <td><input type="text" name="name" id="name" placeholder="Jean" required></td>
                            <td><label for="surname">* Nom :</label></td>
                            <td><input type="text" name="surname" id="surname" placeholder="Valjean" required></td>
                        </tr>
                        <tr>
                            <td><label for="dob">* Date de naissance :</label></td>
                            <td><input type="date" name="dob" id="dob" required></td>
                            <td><label for="gender">* Genre :</label></td>
                            <td>
                                <select name="gender" id="gender" required>
                                    <option value="" disabled selected>Choisissez une option</option>
                                    <option value="men">Homme</option>
                                    <option value="women">Femme</option>
                                    <option value="other">Autre</option>
                                    <option value="capy" disabled>Capybara</option>
                                    <option value="dna">Préfère ne pas répondre</option>
                                </select>
                            </td>
                        </tr>
                    </table>
                    <label for="phone">Tél : </label><input type="tel" name="phone" id="phone"> <br>
                    Acceptez vous de recevoir des offres promotionnelles ?
                    <input type="radio" name="promos" id="no" value="no"> <label for="no" selected> Non</label>
                    <input type="radio" name="promos" id="yes" value="yes"><label for="yes"> Oui</label>
                </fieldset>
                <fieldset>
                    <legend>Services utilisés :</legend>
                    <input type="checkbox" name="water" id="water" value="water"><label for="water"> Eau</label>
                    <input type="checkbox" name="gaz" id="gaz" value="gaz"><label for="gaz"> Gaz</label>
                    <input type="checkbox" name="elec" id="elec" value="elec"><label for="elec"> Électricité</label>
                </fieldset>
            </form>
        </section>
    </main>

</body>
</html>
