<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <title>Subscribe</title>
</head>
<body>
    
    <main class="container d-flex justify-content-center align-items-center min-vh-100">
        <section>
            <form action="" method="post">
                <fieldset class="border border-2 border-info p-3 mb-2">
                    <legend>Inscription :</legend>
                    <div class="row">
                        <div class="col col-6 form-floating">
                            <input type="text" name="user" id="user" placeholder="username" class="form-control" required>
                            <label for="user">* Choisissez un nom d'utilisateur</label>
                        </div>
                            <div class="col col-6 form-floating">
                                <input type="password" name="mdp" id="mdp" placeholder="" class="form-control" required>
                                <label for="mdp">* Entrez un mot de passe</label>
                        </div>
                        <div class="col col-12 form-floating">
                            <input type="email" name="email" id="email" placeholder="" class="form-control" required>
                            <label for="email">* Entrez une adresse mail</label>
                        </div>
                </fieldset>

                <fieldset class="border border-2 border-info p-3 mb-2">
                    <legend>Informations personnelles :</legend>
                    <div class="row">
                        <div class="col col-6 form-floating">
                            <input type="text" name="name" id="name" placeholder="Jean" class="form-control" required>
                            <label for="name">* Prénom :</label>
                        </div>
                        <div class="col col-6 form-floating">
                            <input type="text" name="surname" id="surname" placeholder="Valjean" class="form-control" required>
                            <label for="surname">* Nom :</label>  
                        </div>
                    </div>
                    <div class="row">
                        <div class="col col-6">    
                            <label for="dob">* Date de naissance :</label>
                            <input type="date" name="dob" id="dob" class="form-control" required>
                        </div>
                        <div class="col col-6">
                            <label for="gender">* Genre :</label>
                            <select name="gender" id="gender" class="form-control" required>
                                <option value="" disabled selected>Choisissez une option</option>
                                <option value="men">Homme</option>
                                <option value="women">Femme</option>
                                <option value="other">Autre</option>
                                <option value="capy" disabled>Capybara</option>
                                <option value="dna">Préfère ne pas répondre</option>
                            </select>
                        </div>
                    </div>

                    <div class="row">
                        <label for="phone">Tél :</label><input type="tel" name="phone" id="phone" class="form-control"> <br>
                    </div>
                    Acceptez vous de recevoir des offres promotionnelles ?
                        <div class="form-check form-check-inline">
                            <input type="radio" name="promos" id="no" value="no" class="form-check-input" selected> <label for="no" class="form-check-label"> Non</label>
                        </div> 
                        <div class="form-check form-check-inline">
                            <input type="radio" name="promos" id="yes" value="yes" class="form-check-input"><label for="yes" class="form-check-label"> Oui</label>
                        </div>       
                </fieldset>

                <fieldset class="border border-2 border-info p-3 mb-2">
                    <legend>Services utilisés :</legend>
                        <div class="form-check form-check-inline">
                            <input type="checkbox" name="water" id="water" value="water" class="form-check-input"><label for="water" class="form-check-label">Eau</label>
                        </div> 
                        <div class="form-check form-check-inline">
                            <input type="checkbox" name="gaz" id="gaz" value="gaz" class="form-check-input"><label for="gaz" class="form-check-label">Gaz</label>
                        </div> 
                        <div class="form-check form-check-inline">
                            <input type="checkbox" name="elec" id="elec" value="elec" class="form-check-input"><label for="elec" class="form-check-label">Électricité</label>
                        </div>                     
                </fieldset>
                <div class="text-center">
                        <label for="send"><input class="btn btn-primary" type="submit" name="submit" id="submit" value="S'inscrire"></label>
                    </div>
            </form>
        </section>
    </main>

</body>
</html>
